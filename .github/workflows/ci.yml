name: CI
on: [push, pull_request]
jobs:
  quality:
    runs-on: ubuntu-24.04
    env: {LLM_PROVIDER: none, DATABASE_URL: "sqlite:///data/ci.db"}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check rca tests
      - name: Tests
        run: pytest -q
      - name: Evaluation quality gate
        run: python -m rca.eval.run --gate
      - uses: actions/upload-artifact@v7
        with: {name: eval-report, path: reports/eval.json}

  integration-postgres:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_USER: rca, POSTGRES_PASSWORD: rca, POSTGRES_DB: rca}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U rca" --health-interval 5s --health-retries 10
    env: {LLM_PROVIDER: none, DATABASE_URL: "postgresql+psycopg://rca:rca@localhost:5432/rca"}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements-dev.txt
      - run: python -m rca.cli seed
      - run: python -m rca.eval.run --gate --limit 40

  integration-neo4j:
    runs-on: ubuntu-24.04
    services:
      neo4j:
        image: neo4j:5.20-community
        env: {NEO4J_AUTH: neo4j/rca-password}
        ports: ["7687:7687"]
        options: --health-cmd "wget -qO- http://localhost:7474 || exit 1" --health-interval 10s --health-retries 20
    env: {NEO4J_TEST_URI: "bolt://localhost:7687", NEO4J_TEST_PASSWORD: rca-password, LLM_PROVIDER: none}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements-dev.txt
      - run: pytest -q tests/test_neo4j_integration.py

  docker:
    runs-on: ubuntu-24.04
    needs: quality
    permissions: {contents: read, packages: write}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        if: github.ref == 'refs/heads/main'
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository }}:latest
